name: Release
on:
  push:
    tags: ["v*"]
permissions: {}
jobs:
  # Install, check and package with no secrets and read-only access; the publish job only ships these files.
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with: { version: 9.15.4 }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22, package-manager-cache: false }
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Tag must point at a commit on main
        run: git fetch --depth=200 origin main && git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Verify tag matches package version
        run: |
          v=$(node -p "require('./packages/cli/package.json').version")
          [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "tag ${GITHUB_REF_NAME} != package v$v"; exit 1; }
      - name: Pack the npm package
        working-directory: packages/cli
        run: mkdir -p ../../release && pnpm pack --pack-destination ../../release
      - name: Package VS Code extension
        working-directory: packages/vscode
        run: pnpm package && pnpm exec vsce ls --no-dependencies && cp agent-theatre.vsix ../../release/
      - run: ls -l release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: release, path: release/, if-no-files-found: error, retention-days: 7 }

  # Publish only: no checkout, no install, no project scripts. Each token is visible to its own step only.
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # the GitHub release
      id-token: write # npm provenance
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: release, path: release }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22, package-manager-cache: false, registry-url: "https://registry.npmjs.org" }
      - name: Publish agent-theatre to npm
        if: env.NPM_TOKEN != ''
        env: { NODE_AUTH_TOKEN: "${{ secrets.NPM_TOKEN }}", NPM_TOKEN: "${{ secrets.NPM_TOKEN }}" }
        run: npm publish "./release/agent-theatre-${GITHUB_REF_NAME#v}.tgz" --access public --provenance
      - name: Publish to VS Code Marketplace
        if: env.VSCE_PAT != ''
        env: { VSCE_PAT: "${{ secrets.VSCE_PAT }}" }
        run: npx --yes @vscode/vsce@4.0.0 publish --no-dependencies --packagePath ./release/agent-theatre.vsix
      - name: Publish to Open VSX
        if: env.OVSX_PAT != ''
        env: { OVSX_PAT: "${{ secrets.OVSX_PAT }}" }
        run: npx --yes ovsx@1.3.0 publish ./release/agent-theatre.vsix   # token read from OVSX_PAT env, never on the command line
      - name: Bump the Homebrew formula
        if: env.TAP_TOKEN != ''
        env: { TAP_TOKEN: "${{ secrets.TAP_TOKEN }}" }
        run: |
          v="${GITHUB_REF_NAME#v}"
          sha=$(sha256sum "release/agent-theatre-$v.tgz" | cut -d' ' -f1)
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$TAP_TOKEN" | base64 -w0)"
          git -c http.extraheader="$auth" clone -q https://github.com/shreyassaw5394/homebrew-tap.git /tmp/tap
          sed -i "s#agent-theatre-[0-9.]*\.tgz#agent-theatre-$v.tgz#; s#sha256 \"[0-9a-f]*\"#sha256 \"$sha\"#" /tmp/tap/Formula/agent-theatre.rb
          cd /tmp/tap && git config user.name release-bot && git config user.email release@agenttheatre.dev && git commit -qam "agent-theatre $v" && git -c http.extraheader="$auth" push -q
      - name: GitHub release with the .vsix
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: release/agent-theatre.vsix
          generate_release_notes: true
