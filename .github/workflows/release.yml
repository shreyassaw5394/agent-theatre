name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
  id-token: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with: { version: 9.15.4 }
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm, registry-url: "https://registry.npmjs.org" }
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Tag must point at a commit on main
        run: git fetch --depth=200 origin main && git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Verify tag matches package version
        run: |
          v=$(node -p "require('./packages/cli/package.json').version")
          [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "tag ${GITHUB_REF_NAME} != package v$v"; exit 1; }
      - name: Publish agent-theatre to npm
        if: env.NPM_TOKEN != ''
        working-directory: packages/cli
        env: { NODE_AUTH_TOKEN: "${{ secrets.NPM_TOKEN }}", NPM_TOKEN: "${{ secrets.NPM_TOKEN }}" }
        run: pnpm publish --no-git-checks --access public --provenance
      - name: Package VS Code extension
        working-directory: packages/vscode
        run: pnpm package
      - name: Publish to VS Code Marketplace
        if: env.VSCE_PAT != ''
        working-directory: packages/vscode
        env: { VSCE_PAT: "${{ secrets.VSCE_PAT }}" }
        run: npx @vscode/vsce publish --no-dependencies --packagePath agent-theatre.vsix
      - name: Publish to Open VSX
        if: env.OVSX_PAT != ''
        working-directory: packages/vscode
        env: { OVSX_PAT: "${{ secrets.OVSX_PAT }}" }
        run: npx ovsx publish agent-theatre.vsix   # token read from OVSX_PAT env, never on the command line
      - name: Bump the Homebrew formula
        if: env.TAP_TOKEN != ''
        env: { TAP_TOKEN: "${{ secrets.TAP_TOKEN }}" }
        run: |
          v=$(node -p "require('./packages/cli/package.json').version")
          for i in 1 2 3 4 5 6; do curl -fsSL "https://registry.npmjs.org/agent-theatre/-/agent-theatre-$v.tgz" -o /tmp/at.tgz && break || sleep 20; done
          sha=$(sha256sum /tmp/at.tgz | cut -d' ' -f1)
          git clone -q "https://x-access-token:${TAP_TOKEN}@github.com/shreyassaw5394/homebrew-tap.git" /tmp/tap
          sed -i "s#agent-theatre-[0-9.]*\.tgz#agent-theatre-$v.tgz#; s#sha256 \"[0-9a-f]*\"#sha256 \"$sha\"#" /tmp/tap/Formula/agent-theatre.rb
          cd /tmp/tap && git config user.name release-bot && git config user.email release@agenttheatre.dev && git commit -qam "agent-theatre $v" && git push -q
      - name: GitHub release with the .vsix
        uses: softprops/action-gh-release@v3
        with:
          files: packages/vscode/agent-theatre.vsix
          generate_release_notes: true
