name: Publish to MCP Registry
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
# OIDC lets the registry verify we own io.github.shreyassaw5394/* — no secrets.
permissions: {}
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: Keep server.json in step with the CLI package
        run: |
          PKG=$(node -p "require('./packages/cli/package.json').version")
          SRV=$(node -p "require('./server.json').version")
          test "$PKG" = "$SRV" || { echo "::error::server.json ($SRV) != packages/cli ($PKG)"; exit 1; }
      - name: Wait for npm to index this version
        run: |
          PKG=$(node -p "require('./packages/cli/package.json').version")
          for i in $(seq 1 30); do
            if [ "$(npm view agent-theatre version 2>/dev/null)" = "$PKG" ]; then echo "npm has $PKG"; exit 0; fi
            echo "waiting for npm ($i/30)"; sleep 20
          done
          echo "::warning::npm did not show $PKG in time; publishing anyway"
      - name: Install mcp-publisher (pinned)
        run: |
          curl -fsSL -o mcp-publisher_linux_amd64.tar.gz "https://github.com/modelcontextprotocol/registry/releases/download/v1.8.6/mcp-publisher_linux_amd64.tar.gz"
          echo "1fbe93fc0783c2394d8012c8d6e50a59e98cb2cc2d216264cc69f405d0e21340  mcp-publisher_linux_amd64.tar.gz" | sha256sum -c -
          tar xzf mcp-publisher_linux_amd64.tar.gz mcp-publisher
          chmod +x mcp-publisher
      - name: Login via GitHub OIDC and publish
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
